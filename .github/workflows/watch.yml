name: box-watch (manual diagnostic only)
# Retired 2026-09-07: GitHub ran a 10-minute schedule hours late.
# Cloudflare Tunnel Health supplies the off-box alarm.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public application health
        run: |
          # No redirects to login pages; require HTTP 200.
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 https://keywars.io/api/health)
          test "$code" = 200 || { echo "Application health returned HTTP $code"; exit 1; }
          echo 'Application health endpoint returned HTTP 200.'
# No schedule, heartbeat, email, keepalive commit, or repository secrets used.
